<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceBridge</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0e0f15;
    --bg-2: #161824;
    --card: rgba(255, 255, 255, 0.055);
    --card-strong: rgba(255, 255, 255, 0.085);
    --text: #f3f5fa;
    --muted: #8d93a7;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #7aa2ff;
    --accent-2: #b18cff;
    --green: #4dd08a;
    --orange: #ffb45c;
    --red: #ff6b7a;
    --blue: #5aa9ff;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --radius: 18px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f4fa;
      --bg-2: #e7ebf6;
      --card: rgba(255, 255, 255, 0.7);
      --card-strong: #ffffff;
      --text: #171922;
      --muted: #687083;
      --line: rgba(10, 20, 50, 0.09);
      --accent: #3d6bff;
      --accent-2: #8156ff;
      --shadow: 0 18px 40px rgba(35, 45, 80, 0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 75% at 8% 0%, rgba(122, 162, 255, 0.20), transparent 60%),
      radial-gradient(85% 60% at 105% 0%, rgba(177, 140, 255, 0.16), transparent 55%),
      linear-gradient(160deg, var(--bg), var(--bg-2));
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    overflow: hidden;
    user-select: none;
  }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 13px; }
  .orb {
    width: 52px; height: 52px; flex: 0 0 auto; border-radius: 50%;
    position: relative; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.28), transparent 42%), var(--card-strong);
    border: 1px solid var(--line);
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .orb::after {
    content: ""; width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: background .3s ease;
  }
  body[data-state="listening"] .orb { border-color: rgba(77,208,138,.5); animation: pulse 1.8s infinite; }
  body[data-state="listening"] .orb::after { background: var(--green); }
  body[data-state="transcribing"] .orb::after { background: var(--orange); }
  body[data-state="thinking"] .orb::after { background: var(--orange); animation: breathe 1.4s infinite; }
  body[data-state="speaking"] .orb::after { background: var(--blue); animation: breathe 1.1s infinite; }
  body[data-state="muted"] .orb::after { background: var(--muted); }
  body[data-state="error"] .orb::after { background: var(--red); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(77,208,138,.45); }
    70% { box-shadow: 0 0 0 16px rgba(77,208,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(77,208,138,0); }
  }
  @keyframes breathe { 50% { transform: scale(1.35); } }
  .titles { flex: 1; min-width: 0; }
  #status { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  #meta { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: 0 0 auto; font-size: 10px; color: var(--muted);
    border: 1px solid var(--line); background: var(--card);
    padding: 5px 9px; border-radius: 999px; white-space: nowrap;
  }

  .toolbar { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field > span { font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-left: 2px; }
  select {
    appearance: none; width: 100%; min-width: 0;
    font: inherit; font-size: 11px; color: var(--text);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 11px; padding: 7px 24px 7px 9px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }
  .ghost {
    width: 32px; height: 32px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .ghost:hover { background: var(--card-strong); }

  .chat {
    position: relative; flex: 1; min-height: 0; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px;
    scroll-behavior: smooth;
  }
  .messages { display: flex; flex-direction: column; gap: 8px; }
  .empty {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 8px;
    text-align: center; padding: 24px; color: var(--muted); font-size: 12.5px; line-height: 1.55;
    pointer-events: none;
  }
  .empty span { display: block; font-size: 10.5px; opacity: .72; }
  .empty-orb {
    width: 46px; height: 46px; margin: 0 auto 4px; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.3), transparent 45%), var(--card-strong);
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .msg { display: flex; animation: rise .22s ease both; }
  .msg.user { justify-content: flex-end; }
  .msg.info { justify-content: center; }
  .bubble {
    max-width: 85%; padding: 9px 12px; border-radius: 16px;
    font-size: 12px; line-height: 1.45; word-wrap: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-bottom-right-radius: 5px;
    box-shadow: 0 6px 18px rgba(90, 120, 255, 0.25);
  }
  .msg.assistant .bubble {
    background: var(--card-strong); border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }
  .msg.info .bubble {
    max-width: 92%; padding: 4px 10px; border-radius: 999px;
    background: transparent; border: 1px dashed var(--line);
    color: var(--muted); font-size: 10.5px;
  }
  .time { margin-top: 4px; font-size: 9px; opacity: .55; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .services { display: flex; flex-direction: column; gap: 6px; max-height: 92px; overflow-y: auto; }
  .services-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .services-head > span { font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .ghost.small { width: 22px; height: 22px; font-size: 12px; border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-size: 10.5px; color: var(--muted); white-space: nowrap;
    cursor: pointer; transition: border-color .15s ease, background .15s ease, opacity .15s ease;
  }
  .chip:hover { border-color: rgba(122, 162, 255, .45); background: var(--card-strong); }
  .chip.disabled { opacity: .5; }
  .chip.locked { cursor: default; }
  .chip.locked:hover { border-color: var(--line); background: var(--card); }
  .count { opacity: .6; margin-left: 2px; }
  .hint { font-size: 9px; color: var(--muted); opacity: .65; margin-left: auto; margin-right: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.connected { background: var(--green); box-shadow: 0 0 7px rgba(77,208,138,.75); }
  .dot.failed, .dot.error { background: var(--red); }
  .dot.disabled { background: var(--muted); }
  .dot.unknown { background: var(--orange); }

  .dock {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px; box-shadow: var(--shadow);
  }
  .meter { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  #level { width: 0%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), var(--accent)); transition: width .08s linear; }
  .primary {
    width: 100%; padding: 12px 14px; border: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 14px; font-weight: 650; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 24px rgba(90, 120, 255, 0.28);
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  .primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(90, 120, 255, 0.34); }
  .primary:active { transform: translateY(0); }
  .primary.stop { background: linear-gradient(135deg, #ff7c8c, #ff4d6d); box-shadow: 0 10px 24px rgba(255, 80, 110, 0.3); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .secondary {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 8px 6px; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-size: 10.5px; white-space: nowrap;
  }
  .secondary:hover { background: var(--card-strong); }
  .secondary:disabled { opacity: .32; cursor: default; }
  .secondary.active { border-color: rgba(77,208,138,.45); background: rgba(77,208,138,.12); color: var(--green); }
  #mute.active { border-color: rgba(255,107,122,.45); background: rgba(255,107,122,.12); color: var(--red); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 9.5px; }
  .switch { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .switch input { accent-color: var(--accent); margin: 0; }
  .icon { width: 15px; height: 15px; flex: 0 0 auto; }
  .icon.solid { fill: currentColor; stroke: none; }
</style>
</head>
<body data-state="off">
  <header>
    <div class="orb" aria-hidden="true"></div>
    <div class="titles">
      <div id="status">Bereit</div>
      <div id="meta">Sitzung – · Modell Standard</div>
    </div>
    <div class="badge" id="modeBadge">Sprachmodus</div>
  </header>

  <div class="toolbar">
    <label class="field">
      <span>Modell</span>
      <select id="model" aria-label="Modell"></select>
    </label>
    <label class="field">
      <span>Sitzung</span>
      <select id="session" aria-label="Sitzung"></select>
    </label>
    <button id="newSession" class="ghost" title="Neue Sitzung">＋</button>
  </div>

  <main class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="empty-orb"></div>
      <div>Bereit für dein erstes Wort.</div>
      <span>Starte das Zuhören und sprich.<br>Oder tippe auf „Senden", wenn du fertig bist.</span>
    </div>
    <div class="messages" id="messages"></div>
  </main>

  <section class="services">
    <div class="services-head">
      <span>Dienste <span id="serviceCount" class="count"></span></span>
      <span class="hint">klicken zum Umschalten</span>
      <button id="refresh" class="ghost small" title="Dienste, Sitzungen und Modelle aktualisieren">↻</button>
    </div>
    <div class="chips" id="mcps"></div>
  </section>

  <footer class="dock">
    <div class="meter" title="Mikrofonpegel"><div id="level"></div></div>
    <button id="toggle" class="primary">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
      <svg class="icon hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
      <span id="toggleLabel">Zuhören</span>
    </button>
    <div class="row">
      <button id="send" class="secondary" title="Aufnahme sofort abschicken">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12 20 4.5 13 20l-2.5-6-6-1.5Z"/></svg>
        <span>Senden</span>
      </button>
      <button id="stop" class="secondary" title="Laufende Aufgabe abbrechen">
        <svg class="icon solid" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
        <span>Stopp</span>
      </button>
      <button id="mute" class="secondary" title="Mikrofon stumm schalten">
        <svg class="icon icon-mic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
        <svg class="icon icon-mic-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3v-2M9 9V6a3 3 0 0 1 5.7-1.3M5 11a7 7 0 0 0 10.5 6.1M12 18v3M8 21h8M3 3l18 18"/></svg>
        <span>Mikrofon</span>
      </button>
      <button id="speak" class="secondary" title="Sprachausgabe an/aus">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        <span>Stimme</span>
      </button>
    </div>
    <div class="foot">
      <span id="latency">STT – · LLM – · TTS –</span>
      <label class="switch" title="Beim Start die letzte Sitzung fortsetzen">
        <input type="checkbox" id="resume">
        <span>fortsetzen</span>
      </label>
    </div>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);
  const send = (action, payload = {}) => {
    const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.voice;
    if (bridge) bridge.postMessage(Object.assign({ action }, payload));
  };

  let state = {};
  let models = [];
  let sessions = [];
  let mcps = [];

  const sec = (value) => (value === null || value === undefined ? "–" : Number(value).toFixed(1) + "s");
  const shorten = (text, max) => (text && text.length > max ? "…" + text.slice(-(max - 1)) : text);

  function syncSelect(id, value) {
    const el = $(id);
    if (!el) return;
    if (value && !Array.from(el.options).some((option) => option.value === value)) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = id === "model" ? value : "…" + value.slice(-6);
      el.appendChild(option);
    }
    if (el.value !== value) el.value = value;
  }

  function render() {
    document.body.dataset.state = state.state || "off";
    $("status").textContent = state.label || "Bereit";
    const session = state.session ? "…" + state.session.slice(-6) : "–";
    const model = state.model || "Standard";
    $("meta").textContent = "Sitzung " + session + " · Modell " + shorten(model, 34);
    $("modeBadge").textContent = state.muted ? "Mikrofon stumm" : "Sprachmodus";

    const running = !!state.running;
    $("toggleLabel").textContent = running ? "Stoppen" : "Zuhören";
    $("toggle").classList.toggle("stop", running);
    $("toggle").querySelectorAll(".icon")[0].classList.toggle("hidden", running);
    $("toggle").querySelectorAll(".icon")[1].classList.toggle("hidden", !running);

    $("stop").disabled = !state.busy;
    $("send").disabled = !state.listening;

    $("mute").classList.toggle("active", !!state.muted);
    $("mute").querySelector(".icon-mic-on").classList.toggle("hidden", !!state.muted);
    $("mute").querySelector(".icon-mic-off").classList.toggle("hidden", !state.muted);
    $("mute").querySelector("span").textContent = state.muted ? "Stumm" : "Mikrofon";
    $("mute").title = state.muted ? "Mikrofon aktivieren" : "Mikrofon stumm schalten";

    const speaking = state.speak !== false;
    $("speak").classList.toggle("active", speaking);
    $("speak").querySelector("span").textContent = speaking ? "Stimme" : "Stimme aus";
    $("speak").title = speaking ? "Sprachausgabe ausschalten" : "Sprachausgabe einschalten";

    $("level").style.width = Math.round((state.level || 0) * 100) + "%";

    const latency = state.latency || {};
    $("latency").textContent =
      "STT " + sec(latency.stt) + " · LLM " + sec(latency.llm) + " · TTS " + sec(latency.tts);

    $("resume").checked = !!state.resume;

    if (state.model !== undefined) syncSelect("model", state.model || "");
    if (state.session !== undefined) syncSelect("session", state.session || "");
  }

  function setModels(rows) {
    models = rows || [];
    const select = $("model");
    select.innerHTML = "";
    const standard = document.createElement("option");
    standard.value = "";
    standard.textContent = "Standard";
    select.appendChild(standard);
    for (const row of models) {
      const option = document.createElement("option");
      option.value = row.value;
      option.textContent = row.label || row.value;
      select.appendChild(option);
    }
    syncSelect("model", state.model || "");
  }

  function setSessions(rows) {
    sessions = rows || [];
    const select = $("session");
    select.innerHTML = "";
    for (const row of sessions) {
      const option = document.createElement("option");
      option.value = row.id;
      option.textContent = row.label || row.id;
      select.appendChild(option);
    }
    if (state.session && !sessions.some((row) => row.id === state.session)) {
      const option = document.createElement("option");
      option.value = state.session;
      option.textContent = "…" + state.session.slice(-6);
      select.appendChild(option);
    }
    if (!select.options.length) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = "Keine Sitzung";
      select.appendChild(option);
    } else if (!Array.from(select.options).some((option) => option.value === "")) {
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Sitzung wählen";
      select.insertBefore(placeholder, select.firstChild);
    }
    syncSelect("session", state.session || "");
  }

  function statusClass(value) {
    const text = String(value || "").toLowerCase();
    if (text === "connected" || text === "ready" || text === "active") return "connected";
    if (text === "failed" || text === "error") return "failed";
    if (text === "disabled" || text === "off") return "disabled";
    return "unknown";
  }

  function setMcps(rows) {
    mcps = rows || [];
    const wrap = $("mcps");
    wrap.innerHTML = "";
    $("serviceCount").textContent = mcps.length ? String(mcps.length) : "";
    if (!mcps.length) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = "Keine Dienste";
      wrap.appendChild(chip);
      return;
    }
    for (const row of mcps) {
      const enabled = row.enabled !== false;
      const configurable = row.configurable !== false;
      const status = enabled ? row.status : "disabled";
      const chip = document.createElement("span");
      chip.className =
        "chip" + (enabled ? "" : " disabled") + (configurable ? "" : " locked");
      chip.title =
        row.name + ": " + status + (enabled ? "" : " (aus)") +
        (configurable ? " – klicken zum " + (enabled ? "Ausschalten" : "Einschalten") : " – Integration, nicht schaltbar");
      const dot = document.createElement("span");
      dot.className = "dot " + statusClass(status);
      const label = document.createElement("span");
      label.textContent = row.name;
      chip.appendChild(dot);
      chip.appendChild(label);
      if (configurable) {
        chip.addEventListener("click", () =>
          send("mcp", { name: row.name, enabled: !enabled })
        );
      }
      wrap.appendChild(chip);
    }
  }

  function setTranscript(lines) {
    const box = $("messages");
    box.innerHTML = "";
    const entries = lines || [];
    for (const line of entries) {
      const item = document.createElement("div");
      item.className = "msg " + (line.role === "user" ? "user" : line.role === "info" ? "info" : "assistant");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const text = document.createElement("div");
      text.textContent = line.text || "";
      bubble.appendChild(text);
      if (line.time) {
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = line.time;
        bubble.appendChild(time);
      }
      item.appendChild(bubble);
      box.appendChild(item);
    }
    $("empty").classList.toggle("hidden", entries.length > 0);
    const chat = $("chat");
    chat.scrollTop = chat.scrollHeight;
  }

  window.voice = {
    update(patch) {
      state = Object.assign({}, state, patch || {});
      render();
    },
    setModels,
    setSessions,
    setMcps,
    setTranscript,
  };

  $("toggle").addEventListener("click", () => send("toggle"));
  $("stop").addEventListener("click", () => send("stop"));
  $("send").addEventListener("click", () => send("send"));
  $("mute").addEventListener("click", () => send("mute"));
  $("speak").addEventListener("click", () => send("speak"));
  $("newSession").addEventListener("click", () => send("newSession"));
  $("refresh").addEventListener("click", () => send("refresh"));
  $("resume").addEventListener("change", (event) => send("resume", { value: event.target.checked }));
  $("model").addEventListener("change", (event) => send("model", { value: event.target.value }));
  $("session").addEventListener("change", (event) => send("session", { id: event.target.value }));

  window.addEventListener("error", (event) => {
    send("jsError", { message: String(event.message || "unbekannt") });
  });

  document.addEventListener("DOMContentLoaded", () => {
    render();
    send("ready");
  });
</script>
</body>
</html>
